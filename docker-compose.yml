services:
  mongo:
    image: mongo:8.2.5
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 1m30s
      timeout: 30s
      retries: 3
      start_period: 20s

    volumes:
      - C:/MongoData/db:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    depends_on:
      - backend

    volumes:
      - ./client:/app
      - /app/node_modules
